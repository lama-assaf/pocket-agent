name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # See the build-mac job's equivalent step (below) for why `cache: 'npm'`
      # above is enough to make better-sqlite3's prebuilt-binary fetch a
      # cache hit instead of a network download on repeat runs.
      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # better-sqlite3's own `install` script tries prebuild-install before
      # ever falling back to a from-source node-gyp compile (see CLAUDE.md's
      # native module note / docs/dev-setup.md); prebuild-install's
      # downloaded tarballs land in npm's cache dir, which `cache: 'npm'`
      # above already persists across runs keyed on package-lock.json — so a
      # matching prebuilt binary is a cache hit + local unpack, not a
      # network fetch, on every run after the first.
      - name: Install dependencies
        run: npm install

      # No Apple Developer account/certificates in this project — mac builds
      # ship unsigned and un-notarized. This mirrors `npm run dist:local`
      # exactly (see package.json's `dist:local` script) rather than
      # `dist`/plain `--mac`, so CI and local builds behave identically.
      # Gatekeeper will show "unidentified developer" on first launch; see
      # docs/updating-unsigned.md for the tester workaround (right-click →
      # Open). electron-builder skips notarization automatically once
      # signing itself is skipped (`identity=null`), regardless of the
      # `mac.notarize: true` setting in package.json, so no APPLE_* env vars
      # are needed or read here.
      - name: Build (unsigned)
        run: npm run build && npx electron-builder --mac --arm64 --x64 --config.mac.identity=null -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # See the build-mac job's equivalent step: caches prebuild-install's
      # downloaded better-sqlite3 binaries (and npm's own package cache)
      # keyed on package-lock.json, so this doesn't refetch from the network
      # on every run.
      - name: Install dependencies
        run: npm install

      - name: Build and package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --win --x64 --arm64 -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: win-build
          path: |
            release/*-setup.exe
            release/*.zip
            release/latest.yml

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: mac-build
          path: release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: win-build
          path: release/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/latest-mac.yml
            release/latest.yml
          body: |
            ## Pocket Agent ${{ github.ref_name }}

            A persistent personal AI assistant with memory and scheduling.

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Apple Silicon (M1/M2/M3/M4) | `Pocket-Agent-*-arm64-mac.dmg` |
            | macOS | Intel | `Pocket-Agent-*-x64-mac.dmg` |
            | Windows | x64 | `Pocket-Agent-*-x64-setup.exe` |
            | Windows | ARM64 | `Pocket-Agent-*-arm64-setup.exe` |

            ### Installation

            **macOS** (unsigned build — no Apple Developer account):
            1. Download the DMG for your Mac
            2. Open the DMG and drag r3to.os to Applications
            3. Gatekeeper will block a normal double-click launch ("unidentified developer"). In Applications, **right-click r3to.os → Open → Open** once to approve it; later launches work normally
            4. Launch and enter your Anthropic API key

            See `docs/updating-unsigned.md` for the full update path.

            **Windows:**
            1. Download the setup .exe for your architecture
            2. Run the installer (you may need to click "More info" → "Run anyway" if unsigned)
            3. Launch Pocket Agent and enter your Anthropic API key
