name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # actions/setup-node's cache:'npm' above caches ~/.npm (npm's download
      # cache, keyed on package-lock.json) so `npm ci` re-downloads nothing
      # on a hit. This second cache additionally persists node_modules itself
      # (including the compiled better-sqlite3 addon), keyed on the OS + Node
      # version + lockfile hash, so an unchanged lockfile can skip `npm ci`'s
      # install/link/rebuild work entirely instead of just its network step.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify (format:check + lint + typecheck + test)
        run: npm run verify
